name: Copy the newest TV app into v2.0

# The owner's Downloader code installs
#   https://github.com/tareq58798-a11y/4k-plus-tv-player-tv/releases/download/v2.0/4KPlusTV-AndroidTV.apk
# "Publish Android release" already replaces that file each time. This does it on its own, from the
# newest published release, for when that needs doing again without building anything - the first
# time being the move from the old laptop's builds to the ones signed by the release key.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Fetch the newest release's TV app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$tag" = "v2.0" ]; then echo "::error::The latest release is v2.0 itself."; exit 1; fi
          echo "Copying from $tag"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 4KPlusTV-AndroidTV.apk --dir dist

      - name: Replace the TV app in the v2.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/refresh-downloader-release.sh dist/4KPlusTV-AndroidTV.apk
